name: Bug report
description: Something behaves differently from what the repository documents.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow `SECURITY.md`.
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: The observable behaviour, with the exact command and its output.
      placeholder: |
        $ <command>
        <output>
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Quote the document, test, or contract that says otherwise.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Smallest steps that reproduce it. Link a commit, fixture, or file.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA, release tag, or image digest.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime version, and anything else that changes the result.
      placeholder: |
        OS:
        Runtime:
        Container:
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, or a failing test. Redact credentials.
