name: secret-scan

# Reusable secret scan for every repository in the organisation.
#
# Call it from a repository with:
#
#   name: secret-scan
#   on: [push, pull_request, workflow_dispatch]
#   permissions:
#     contents: read
#   jobs:
#     scan:
#       uses: hashward-io/.github/.github/workflows/secret-scan.yml@main
#
# Pull requests and pushes scan only the commits they add, so historical
# fixtures do not fail a change that introduces no secret. A manual run scans
# the working tree.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          archive="$RUNNER_TEMP/gitleaks.tgz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          args=(--no-banner --redact --exit-code 1 --verbose)
          if [ -f .gitleaks.toml ]; then
            args+=(--config .gitleaks.toml)
          fi
          case "$EVENT_NAME" in
            pull_request)
              git fetch --no-tags origin "$BASE_REF"
              gitleaks git "${args[@]}" --log-opts="origin/${BASE_REF}..HEAD"
              ;;
            push)
              if [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
                gitleaks dir "${args[@]}" .
              else
                gitleaks git "${args[@]}" --log-opts="${BEFORE_SHA}..HEAD"
              fi
              ;;
            *)
              gitleaks dir "${args[@]}" .
              ;;
          esac
